<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;overflow:hidden;background:#0a0a0b}
.c{position:relative;width:1200px;height:630px;overflow:hidden;color:#ececea;font-family:Inter,sans-serif;background:#0a0a0b}
.mono{font-family:'JetBrains Mono',monospace;letter-spacing:.12em;text-transform:uppercase}
.brand{position:absolute;top:44px;left:64px;display:flex;align-items:center;gap:12px;font:600 24px 'Space Grotesk'}

.url{position:absolute;top:50px;right:64px;font:500 20px 'JetBrains Mono';color:#b6b3aa}

#C .wall img{width:100%;height:100%;object-fit:cover}
